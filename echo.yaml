# Echo platform settings. Hot-reloaded: edits apply without a restart (ports need a restart).
host: 127.0.0.1
ports:
  ui: 7777            # backend + web UI
  decision: 8091      # Python decision server (Jebadiah renderer)
  search: 8888        # SearXNG (Docker container echo-searxng)
  embed: 8093         # notes RAG: Qwen3-Embedding-0.6B
  rerank: 8094        # notes RAG: Qwen3-Reranker-0.6B
  hugin: 8088         # Hugin voice notes (Docker stack in vendor/HuginVoiceNotes)
  tts: 8095           # Read tab: Piper text-to-speech (services/tts)
  stt: 8096           # Live tab: faster-whisper speech-to-text (services/stt)

paths:
  data: data          # SQLite, logs, Pi state
  evals: evals        # decisions.jsonl and eval tasks
  llama_server: vendor/llama.cpp/bin/llama-server

# Main model loaded on `./echo up`. Must be an id from models.yaml `main`.
default_model: qwen3.8-27b

agent:
  step_budget: 16             # tool calls per action time before a checkpoint (decision time costs ~25 s on the 4090)
  default_effort: low
  sandbox: true               # run the agent's bash inside bubblewrap
  network: false              # network inside the sandbox
  checkpoints: true           # git checkpoint before each edit batch
  # Context management, like Claude Code's auto-compact: once a run's context passes compact_at of the model's
  # window, its older turns are replaced by a summary. The plan, your messages, the checkpoints and the latest
  # keep_recent of the window stay word for word; "Compact now" in the Agent tab does it on request. New runs only.
  auto_compact: true
  compact_at: 0.7
  keep_recent: 0.25

thresholds:
  needs_human: 0.5            # P(true) above this pauses the run and asks you
  action_safe: 0.5            # P(true) below this drops a queued action
  stalled_replans: 2          # "stalled" this many times in a row forces a re-plan

notify:
  desktop: true               # notify-send (mako)
  ntfy_url: ""                # e.g. http://127.0.0.1:2586/echo ; empty = off

# Notes RAG: Markdown folders indexed for search (Hugin writes its notes to the first one).
# Add more folders (an Obsidian vault, project notes, ...) and they are indexed automatically.
notes:
  dirs:
    - data/hugin/notes
  hugin_dir: vendor/HuginVoiceNotes

# Live tab: hands-free voice chat. Speech to text runs on the CPU (services/stt, faster-whisper): base.en
# transcribes a short question in ~0.35 s on 8 threads; small.en takes ~0.9 s and gained nothing on clear speech.
live:
  stt_model: base.en
  stt_threads: 8              # 16 was slower than 8 (the threads compete)
  effort: "off"               # answers' thinking level; off starts speaking soonest (docs/benchmarks.md)
  voice: piper:en_US-lessac-medium
  # The main model Live answers with by default (models.yaml id); the tab's "answers with" picker overrides it, per
  # browser and per persona. The 27B fills the GPU and leaves no room for a GPU voice such as Qwen3-TTS Fast; this 9B
  # leaves ~8 GB. Starting Live swaps it in; Chat and the agent swap the 27B back when they run.
  # Until it is downloaded, Live uses whichever main model is loaded.
  model: mimo-v2.6-9b

monitor:
  interval_ms: 1000

# Git tab: branch graphs of the git repositories in these folders (the folder itself, or its direct subfolders), and
# of these GitHub repositories with their pull requests. Merging needs GITHUB_TOKEN in .env (see .env.example).
git:
  dirs:
    - /projects       # Docker: your PROJECTS_DIR
    - ~/Projects      # native
  github:
    - nmello3301/Echo_Agent
